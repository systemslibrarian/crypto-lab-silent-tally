name: Test

# Pull requests are judged by deploy.yml, which calls this workflow as its
# `test` job alongside the browser gate. A pull_request trigger here as well
# would run this suite twice per PR, and the copy outside deploy.yml is not the
# one the Dependabot auto-merge waits on.
on:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's gate
  workflow_call: # invoked by deploy.yml before publishing

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Install wasm-pack
        # Pinned for the reason spelled out in deploy.yml: the action's `latest`
        # lookup silently falls back to a hardcoded wasm-pack v0.9.1 when the
        # unauthenticated releases API rate-limits it, and that build's `wasm-opt`
        # cannot parse the reference-types module current rustc emits. This job
        # won the coin flip in run 43794762059 while `build` lost it; same risk.
        # Keep this version and deploy.yml's in step.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.1'

      - name: Build WASM (needed for the TypeScript typecheck)
        run: wasm-pack build --target web --out-dir pkg

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Frontend unit tests
        run: npm test
